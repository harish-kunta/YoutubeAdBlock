name: Suggestion or feedback
description: Suggest an improvement or share product feedback.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: >-
        This form is submitted to GitHub only when you choose to submit it. Please do not include passwords, cookies, or private account information.
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see improved?
      description: Tell us what you expected and what would make the extension more useful.
    validations:
      required: true
